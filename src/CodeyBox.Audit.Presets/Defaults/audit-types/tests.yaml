id: tests
displayName: "Test meaningfulness review"
llmAuditorName: tests:meaningfulness-review
patterns:
  - regex: '^\s*assert\s+True\s*$'
    description: 'assert True (no-op assertion)'
  - regex: '^\s*assert\s+1\s*==\s*1\s*$'
    description: 'assert 1 == 1 (trivially-true)'
  - regex: '^\s*assert\s+not\s+False\s*$'
    description: 'assert not False (no-op)'
  - regex: '^\s*pass\s*#\s*test\b'
    description: 'pass-only test body'
    severity: warning
  - regex: '\bAssert\.True\s*\(\s*true\s*[,)]'
    description: 'Assert.True(true) (no-op)'
  - regex: '\bAssert\.IsTrue\s*\(\s*true\s*[,)]'
    description: 'Assert.IsTrue(true) (no-op)'
  - regex: '\bAssert\.False\s*\(\s*false\s*[,)]'
    description: 'Assert.False(false) (no-op)'
  - regex: '\bAssert\.Equal\s*\(\s*(\w+)\s*,\s*\1\s*\)'
    description: 'Assert.Equal(x, x) (no-op)'
  - regex: '\bAssert\.AreEqual\s*\(\s*(\w+)\s*,\s*\1\s*\)'
    description: 'Assert.AreEqual(x, x) (no-op)'
  - regex: '\bAssert\.That\s*\(\s*true\b'
    description: 'Assert.That(true, ...) (no-op)'
  - regex: '\bexpect\s*\(\s*true\s*\)\s*\.\s*toBe\s*\(\s*true\s*\)'
    description: 'expect(true).toBe(true) (no-op)'
  - regex: '\bexpect\s*\(\s*1\s*\)\s*\.\s*toBe\s*\(\s*1\s*\)'
    description: 'expect(1).toBe(1) (no-op)'
  - regex: '\bexpect\s*\(\s*(\w+)\s*\)\s*\.\s*toBe\s*\(\s*\1\s*\)'
    description: 'expect(x).toBe(x) (no-op)'
  - regex: '\bexpect\s*\(\s*(\w+)\s*\)\s*\.\s*toEqual\s*\(\s*\1\s*\)'
    description: 'expect(x).toEqual(x) (no-op)'
  - regex: '\bassert\.True\s*\(\s*t\s*,\s*true\s*[,)]'
    description: 'assert.True(t, true) (no-op)'
  - regex: '\bassert\.Equal\s*\(\s*t\s*,\s*(\w+)\s*,\s*\1\s*\)'
    description: 'assert.Equal(t, x, x) (no-op)'
  - regex: '^\s*assert!\s*\(\s*true\s*\)'
    description: 'assert!(true) (no-op)'
  - regex: '^\s*assert_eq!\s*\(\s*(\w+)\s*,\s*\1\s*\)'
    description: 'assert_eq!(x, x) (no-op)'
reviewFocus: |-
  You are reviewing TESTS: are the tests in this diff MEANINGFUL, and is the change's
  important functionality actually VALIDATED by tests that would fail if it were broken?
  Read BOTH halves of the change: the production code AND the test code.

  Why this lane exists: mechanical line/branch coverage proves a line executed — it does NOT
  prove the feature works. AI-written code frequently compiles and passes mock-only tests
  while the real path is broken. An INTEGRATION/functional test that drives the real wiring
  is the main defense. That gap is exactly what you are here to catch.

  SCOPE — IN-LANE: (1) meaningfulness of tests ADDED or MODIFIED in this diff; (2) validation
  of the change's critical/major functionality, especially through real wiring; (3) tests
  disabled, skipped, or removed in this diff.
  OUT-OF-LANE: bare per-symbol coverage counting — "method/branch X has no test" with NO
  behavioral claim — never file it; file per PIECE OF FUNCTIONALITY instead, one finding per
  piece. Also out: production code style, architecture, and task completeness — except per
  [CROSS-LANE-SECURITY].

  NON-EXECUTABLE CHANGE EXEMPTION (applies before Step 2): when the diff changes only
  documentation, prose, comments, static marker/content files, or declarative metadata that
  cannot affect runtime/build/deploy behavior, do NOT require a new test and do NOT file a
  missing-test finding. Existing build/validation commands or direct artifact inspection are
  sufficient for this lane. Still apply Steps 1 and 3 normally if the diff adds, modifies,
  disables, or removes tests.

  DEFINITIONS (closed — do not extend them):
  - CRITICAL functionality = ANY of:
    (i)   a deliverable explicitly listed in the task text; if the task is prose with no
          enumerated deliverables, ONLY the single primary behavior of its first sentence —
          do not infer more;
    (ii)  a security / auth / integrity / limit guard;
    (iii) a data-writing, state-transition, or persistence path — EXCLUDING
          telemetry/metrics/log writes, which are ALWAYS non-critical;
    (iv)  an error / rollback / failure-recovery branch of a new operation;
    (v)   behavior whose correctness depends on REAL component interaction: a DB,
          filesystem, network, subprocess, IPC or hardware/peripheral interface,
          cross-module flow, or serialization round-trip (exactly where mock-only tests
          lie).
  - MAJOR = important, user-facing or relied-upon behavior that is not critical.
  - NON-CRITICAL = everything else: happy-path variants, normalization, formatting, logging,
    metrics off-branches, distribution assertions, behavior-preserving refactors.
  - DOUBT (explicit): critical-vs-major → treat as MAJOR; major-vs-non → treat as
    NON-critical.

  ===== SEVERITY RUBRIC — TESTS =====

  STEP 1 — MISLEADING TEST (a test added or modified in this diff) → ERROR when it fails
  either check:
  - 1a ASSERTION EXISTENCE: it has NO assertion whose subject is a value PRODUCED by the
    code under test (a return value, thrown exception, persisted/emitted output, or
    observable state change). No assertions at all, "did not throw" on a value-returning
    contract, or only tautologies (NotNull on a non-nullable return, Count >= 0, x == x,
    Assert.True(true)) → FAIL.
  - 1b REGRESSION SENSITIVITY (the assertion-dataflow mutation test): for each assertion in
    the test, trace the nearest production statement that computes the asserted value.
    Mentally mutate THAT statement (delete it / invert it / replace it with a constant). The
    test is misleading iff NO assertion flips red under ANY such single-statement mutation
    of the production code. Derive the mutation targets from what the assertions actually
    read — never from the test's name or docstring. When the test mocks a collaborator,
    mutate the production SUT, not the mock. The following are ILLUSTRATIONS of this one
    procedure, not separate rules: mirrored literal (the asserted value is a constant the
    test's own setup introduced, passing through untransformed); success-stub gap (a stub
    returns success/true/visible for the exact failure the test claims to catch); wrong unit
    (the exercised path is not the unit named); claim mismatch (the name says X, no executed
    assertion depends on X).
    NOT misleading: a white-box assertion (cache hit, retry count, ordering, the specific
    query issued) is legitimate when inverting the underlying production behavior would flip
    it.

  STEP 2 — UNVALIDATED FUNCTIONALITY. For each coherent piece of NEW critical/major
  functionality, ask: does any test EXERCISE it working — through its real wiring — such
  that the test would FAIL if the feature were broken? A test that mocks away every
  collaborator, IO, or boundary does NOT validate the real path: it can stay green while the
  feature is broken.
  - A CRITICAL piece with no such test (no test at all, or only mock-only/trivial tests) →
    ERROR. Name the missing test concretely ("no test drives a real merge through git and
    asserts the commit lands"). ONE finding per piece of functionality, never one per
    uncovered symbol.
  - A MAJOR piece with no such test → WARNING.
  - SECURITY OVERRIDE → ERROR: the untested thing is a guard on a nameable path from
    less-trusted input (external caller, another user/tenant, model-agent output, repo file
    content) to a dangerous sink. Do NOT relabel arbitrary internal validation as a
    security guard to force a block — without untrusted reach, grade it as
    critical/major/non-critical per the definitions.
  - A per-branch gap of an otherwise-validated operation (the happy path IS exercised for
    real; one branch is not) → WARNING at most.
  PURITY NOTE for Step 2 descriptions: when real validation is missing because the decision
  logic is inseparable from IO/state (everything must be mocked to test anything), say so
  and name the enabling refactor in the finding: extract the pure decision core — testable
  directly, input to output, no mocks — and keep ONE integration test driving the thin IO
  shell. Pure functions are orders of magnitude cheaper to verify than mutable state; logic
  structured that way needs far less scaffolding to be convincingly validated.

  STEP 3 — DISABLED / SKIPPED / REMOVED tests in this diff: [Skip], [Ignore],
  [Fact(Skip=...)], @pytest.mark.skip, x-prefixed, a commented-out body, or a DELETED test
  whose covered production path still exists:
  - covering CRITICAL or security-relevant behavior → ERROR (it advertises coverage that
    does not run);
  - otherwise → WARNING. Never treat a disabled test as merely "absent".

  FLAKE SOURCES → WARNING: a test added or modified in this diff whose outcome depends on
  wall-clock time or real sleeps, on execution order or shared mutable fixtures, or on live
  network/filesystem state in a unit-scope test where a fake or injected dependency was
  available (name the deterministic substitute: injected clock, seeded randomness, isolated
  fixture, fake). Flaky gate tests erode the whole pipeline's signal. If the nondeterminism
  means the test can PASS while the behavior it claims to verify is broken, that is Step 1
  → ERROR.

  STEP 4 — INFO: non-critical validation gaps; happy-path-only breadth notes; test
  organization (names that don't describe the behavior, unrelated assertions bundled in one
  test, fixtures that obscure simple checks); dead or undrifted fixtures.

  BACKSTOP (hard rule): an ERROR for a MISSING test exists ONLY via Step 2 (a critical piece
  wholly unvalidated, or the security override) or Step 3 (critical/security
  disabled-or-removed). NEVER Error on a per-method or per-branch coverage gap; NEVER Error
  on ambiguous criticality — the doubt rules de-escalate it first.

  MUTATION HINTS for 1b — plausible single-statement bugs a meaningful test must catch:
  off-by-one; inverted condition (== vs !=, < vs <=); dropped null/empty check; wrong field
  used (id vs userId); wrong order of operations; skipped failure-path handling.

  GOOD PATTERNS to look for when judging Step 2 (their presence is what "validated" means):
  integration tests that exercise multiple real components together, where each must work
  for the test to pass; direct input-to-output tests of pure decision logic (no mocks
  required); failure-mode tests (timeout, network error, malformed input,
  exhausted resources, partial failure/retry); edge cases (empty, null, boundary, max/min,
  unicode, concurrent, very large); round-trip tests for serialization/encoding/encryption;
  property tests for parsing and validation where feasible; a regression test reproducing
  any bug this change fixes.

  Trivially-true assertion patterns (Assert.True(true), x == x, expect(x).toBe(x)) may also
  be flagged by a deterministic pattern layer. Per [PARALLEL], still file every one YOU
  judge misleading — never assume the pattern layer caught it or will run.

  LOCATION: cite the test file:line for a misleading or disabled test; for missing
  validation, cite the PRODUCTION file:line of the unvalidated functionality.

  CALIBRATION EXAMPLES (each closes a real reviewer split):
  - A new IGitHost merge path whose ONLY test mocks the git subprocess and asserts the mock
    was called; no test drives a real merge and asserts the commit lands → ERROR (Step 2,
    critical (v)). This is the "compiles and passes mocks but doesn't actually work" case.
  - A new provider that talks to an external CLI, tested only with a hand-written fake
    returning canned success → ERROR if the provider is the task's core deliverable;
    WARNING if it is a secondary/major feature.
  - A new REST endpoint with a real happy-path functional test but no test for its failure
    handling → WARNING (a major branch gap; the feature itself IS validated).
  - "Rollback of patch-apply failure is untested" where the operation's happy path IS
    exercised by a real test → WARNING (a branch gap of a validated operation, not a whole
    unvalidated feature).
  - "CaptureResourceMetrics off-branch untested" → INFO (metrics; always non-critical).
  - "Method Foo() has no unit test", with no behavioral claim, where Foo is not a coherent
    critical/major piece → DO NOT FILE (bare per-symbol coverage counting).
  - Untested NormalizeRulesPath rejection of ".." traversal / embedded \0 → ERROR (security
    override).
  - A test asserts req.UrlSettings.Auth == "sprite", mirroring new
    SpritesUrlSettings("sprite") with nothing transforming the value → ERROR (1b, mirrored
    literal).
  - A Playwright stub whose isVisible falls through to true, so emit-then-replay stays green
    on broken selectors → ERROR (1b, success-stub gap).
  - A test whose body is only `await Sut.DoThing()` on a value-returning contract → ERROR
    (1a).
  - [Fact(Skip="flaky")] on the new merge-gate integrity test → ERROR (Step 3, critical).

  Tests that cannot execute due to ENVIRONMENT limits (a missing external service, an
  unsupported platform) are out of scope for scoring. This does NOT exempt tests DISABLED IN
  SOURCE ([Skip]/[Ignore]/commented-out/removed) — those are graded per Step 3.
  Tests which cannot be run in this environment are not part of the scoring or auditing criteria.
