id: tests
displayName: "Test meaningfulness review"
llmAuditorName: tests:meaningfulness-review
patterns:
  - regex: '^\s*assert\s+True\s*$'
    description: 'assert True (no-op assertion)'
  - regex: '^\s*assert\s+1\s*==\s*1\s*$'
    description: 'assert 1 == 1 (trivially-true)'
  - regex: '^\s*assert\s+not\s+False\s*$'
    description: 'assert not False (no-op)'
  - regex: '^\s*pass\s*#\s*test\b'
    description: 'pass-only test body'
    severity: warning
  - regex: '\bAssert\.True\s*\(\s*true\s*[,)]'
    description: 'Assert.True(true) (no-op)'
  - regex: '\bAssert\.IsTrue\s*\(\s*true\s*[,)]'
    description: 'Assert.IsTrue(true) (no-op)'
  - regex: '\bAssert\.False\s*\(\s*false\s*[,)]'
    description: 'Assert.False(false) (no-op)'
  - regex: '\bAssert\.Equal\s*\(\s*(\w+)\s*,\s*\1\s*\)'
    description: 'Assert.Equal(x, x) (no-op)'
  - regex: '\bAssert\.AreEqual\s*\(\s*(\w+)\s*,\s*\1\s*\)'
    description: 'Assert.AreEqual(x, x) (no-op)'
  - regex: '\bAssert\.That\s*\(\s*true\b'
    description: 'Assert.That(true, ...) (no-op)'
  - regex: '\bexpect\s*\(\s*true\s*\)\s*\.\s*toBe\s*\(\s*true\s*\)'
    description: 'expect(true).toBe(true) (no-op)'
  - regex: '\bexpect\s*\(\s*1\s*\)\s*\.\s*toBe\s*\(\s*1\s*\)'
    description: 'expect(1).toBe(1) (no-op)'
  - regex: '\bexpect\s*\(\s*(\w+)\s*\)\s*\.\s*toBe\s*\(\s*\1\s*\)'
    description: 'expect(x).toBe(x) (no-op)'
  - regex: '\bexpect\s*\(\s*(\w+)\s*\)\s*\.\s*toEqual\s*\(\s*\1\s*\)'
    description: 'expect(x).toEqual(x) (no-op)'
  - regex: '\bassert\.True\s*\(\s*t\s*,\s*true\s*[,)]'
    description: 'assert.True(t, true) (no-op)'
  - regex: '\bassert\.Equal\s*\(\s*t\s*,\s*(\w+)\s*,\s*\1\s*\)'
    description: 'assert.Equal(t, x, x) (no-op)'
  - regex: '^\s*assert!\s*\(\s*true\s*\)'
    description: 'assert!(true) (no-op)'
  - regex: '^\s*assert_eq!\s*\(\s*(\w+)\s*,\s*\1\s*\)'
    description: 'assert_eq!(x, x) (no-op)'
reviewFocus: |-
  You are reviewing TEST ASSERTION QUALITY: do the tests ADDED or MODIFIED in this diff
  actually prove the behavior they execute — with assertions that would fail if the
  behavior were broken? Read BOTH halves of the change: the production code AND the
  test code.

  Why this lane exists: mechanical line coverage proves a line executed — it does NOT
  prove the feature works. AI-written tests frequently execute the code and stay green
  while asserting nothing, asserting on a mock instead of the result, or padding coverage
  to satisfy the gate. That gaming is exactly what you are here to catch.

  DIVISION OF LABOR (hard rule): test EXISTENCE and line-coverage completeness belong to
  the deterministic `tests:coverage` gate, which blocks on changed executable lines no
  test exercised. That gate owns "is there a test". You own "does the test prove
  anything". NEVER report the mere absence of a test — no finding whose substance is
  "X has no test", "add a test for Y", or "method/branch Z is uncovered", however
  phrased. If no test exists for some production code, that is the coverage gate's
  subject, not yours: stay silent.

  STATELESS: every audit iteration runs in isolation with no cross-iteration memory.
  Judge ONLY the current diff. Never assume, reference, or carry over findings,
  promises, or missing tests from a previous iteration; the same input must yield the
  same findings.

  SCOPE — strictly BOUNDED to tests ADDED or MODIFIED in this diff. Every finding must
  cite a test file:line for such a test. File one finding per gaming test, never one
  per uncovered production symbol.
  OUT-OF-LANE (never file): enumerating untested internal methods, branches, or
  production paths; demanding tests for production code outside this diff; reporting
  mere absence of a test (the coverage gate owns that); production code style,
  architecture, and task completeness — except per [CROSS-LANE-SECURITY].

  NON-EXECUTABLE CHANGE EXEMPTION: when the diff changes only documentation, prose,
  comments, static marker/content files, or declarative metadata that cannot affect
  runtime/build/deploy behavior, do NOT require a new test and do NOT file any finding
  for having no new test. Existing build/validation commands or direct artifact
  inspection are sufficient for this lane. Still apply the finding categories below
  normally if the diff adds, modifies, disables, or removes tests.

  ===== SEVERITY RUBRIC — TESTS (assertion quality only) =====

  FINDING 1 — EXECUTES BUT ASSERTS NOTHING (a test added or modified in this diff)
  → ERROR when it has NO assertion whose subject is a value PRODUCED by the code under
  test (a return value, thrown exception, persisted/emitted output, or observable state
  change). No assertions at all, "did not throw" on a value-returning contract, or only
  tautologies (NotNull on a non-nullable return, Count >= 0, x == x,
  Assert.True(true)) → FAIL.
  - REGRESSION SENSITIVITY (the assertion-dataflow mutation test): for each assertion in
    the test, trace the nearest production statement that computes the asserted value.
    Mentally mutate THAT statement (delete it / invert it / replace it with a constant). The
    test is gaming iff NO assertion flips red under ANY such single-statement mutation
    of the production code. Derive the mutation targets from what the assertions actually
    read — never from the test's name or docstring. When the test mocks a collaborator,
    mutate the production SUT, not the mock. The following are ILLUSTRATIONS of this one
    procedure, not separate rules: mirrored literal (the asserted value is a constant the
    test's own setup introduced, passing through untransformed); success-stub gap (a stub
    returns success/true/visible for the exact failure the test claims to catch); wrong unit
    (the exercised path is not the unit named); claim mismatch (the name says X, no executed
    assertion depends on X).
    NOT gaming: a white-box assertion (cache hit, retry count, ordering, the specific
    query issued) is legitimate when inverting the underlying production behavior would flip
    it.

  FINDING 2 — ASSERTS ON A MOCK/STUB INSTEAD OF THE RESULT-UNDER-TEST → ERROR. The test
  drives the production SUT but its assertions read back the mock's canned behavior
  (mock received a call, stub returned what the test told it to return) rather than a
  value the production code computed. Such a test stays green when the SUT is broken:
  name the assertion and the SUT-produced value it should have read instead. A test that
  must mock a boundary (network, clock, filesystem) still passes when at least one
  assertion depends on SUT logic applied on top of the mocked seam — e.g. mapping,
  validation, retry, or ordering the SUT itself performs.

  FINDING 3 — MISSING OBVIOUS ERROR/EDGE-PATH ASSERTIONS → WARNING. A test added or
  modified in this diff executes an error, failure-recovery, or boundary path (empty,
  null, timeout, malformed input, exhausted resource) but asserts only the happy path,
  leaving the executed edge path unasserted. This is bounded to the test in front of
  you: require the assertion, never a new test file or coverage of production code with
  no test at all. When the decision logic is inseparable from IO/state (everything must
  be mocked to test anything), say so and name the enabling refactor: extract the pure
  decision core — testable directly, input to output, no mocks — and keep ONE
  integration test driving the thin IO shell.

  FINDING 4 — COVERAGE-PADDING TEST → ERROR. A test added or modified in this diff whose
  apparent purpose is to execute lines for the coverage gate rather than to verify
  behavior: it calls into changed code but every assertion would still pass if the
  exercised production logic were replaced with a constant or a stub (apply the Finding
  1 mutation test). Name the padded lines and the behavior-specific assertion that
  would make the test genuine. Per [PARALLEL], file it here even though the cheating
  dimension may also see it — it may not be running, and a padded test corrupts the
  coverage signal the gate depends on.

  DISABLED / SKIPPED / REMOVED tests in this diff: [Skip], [Ignore],
  [Fact(Skip=...)], @pytest.mark.skip, x-prefixed, a commented-out body, or a DELETED test
  whose covered production path still exists. Disabling advertises coverage that does not
  run, which games both this lane and the coverage gate:
  - the disabled test covered security-relevant behavior (a guard on a nameable path
    from less-trusted input — external caller, another user/tenant, model-agent output,
    repo file content — to a dangerous sink) → ERROR;
  - otherwise → WARNING. Never treat a disabled test as merely "absent".

  FLAKE SOURCES → WARNING: a test added or modified in this diff whose outcome depends on
  wall-clock time or real sleeps, on execution order or shared mutable fixtures, or on live
  network/filesystem state in a unit-scope test where a fake or injected dependency was
  available (name the deterministic substitute: injected clock, seeded randomness, isolated
  fixture, fake). Flaky gate tests erode the whole pipeline's signal. If the nondeterminism
  means the test can PASS while the behavior it claims to verify is broken, that is
  Finding 1 → ERROR.

  BACKSTOP (hard rule): an ERROR exists ONLY via Finding 1, 2, or 4 (a gaming test in
  this diff) or a security-relevant disabled-or-removed test. NEVER Error on a
  per-method or per-branch coverage gap; NEVER Error on the mere absence of a test —
  existence and completeness are the coverage gate's job, and doubt de-escalates: if
  you cannot show the test would stay green under the Finding 1 mutation, WARNING at
  most.

  MUTATION HINTS for Finding 1 — plausible single-statement bugs a meaningful test must catch:
  off-by-one; inverted condition (== vs !=, < vs <=); dropped null/empty check; wrong field
  used (id vs userId); wrong order of operations; skipped failure-path handling.

  GOOD PATTERNS in the diff's tests (their presence is what "meaningful" means):
  direct input-to-output tests of pure decision logic (no mocks required); failure-mode
  assertions (timeout, network error, malformed input, exhausted resources,
  partial failure/retry) inside the added tests; edge-case assertions (empty, null,
  boundary, max/min, unicode, concurrent, very large); round-trip assertions for
  serialization/encoding/encryption; a regression assertion reproducing any bug this
  change fixes. INFO at most for the rest: test organization (names that don't describe
  the behavior, unrelated assertions bundled in one test, fixtures that obscure simple
  checks); dead or undrifted fixtures.

  Trivially-true assertion patterns (Assert.True(true), x == x, expect(x).toBe(x)) may also
  be flagged by a deterministic pattern layer. Per [PARALLEL], still file every one YOU
  judge gaming — never assume the pattern layer caught it or will run.

  LOCATION: cite the test file:line of the added-or-modified test. Never cite a
  production file:line to demand a test that does not exist.

  CALIBRATION EXAMPLES (each closes a real reviewer split; all bounded to diff tests):
  - A test asserts req.UrlSettings.Auth == "sprite", mirroring new
    SpritesUrlSettings("sprite") with nothing transforming the value → ERROR (Finding 1,
    mirrored literal).
  - A Playwright stub whose isVisible falls through to true, so emit-then-replay stays green
    on broken selectors → ERROR (Finding 1, success-stub gap).
  - A test whose body is only `await Sut.DoThing()` on a value-returning contract → ERROR
    (Finding 1).
  - A new merge test that mocks the git subprocess and asserts only that the mock was
    called, never the commit the SUT produced → ERROR (Finding 2).
  - A new test that calls into changed code and asserts only `Assert.NotNull(result)` on
    a non-nullable return so the coverage gate sees the lines → ERROR (Finding 4).
  - A new REST-endpoint test asserting the happy-path response but executing the 4xx
    branch with no assertion on it → WARNING (Finding 3: require the assertion, not a
    new test).
  - [Fact(Skip="flaky")] added on the new merge-gate test → WARNING (disabled; ERROR
    only if the skipped test covered security-relevant behavior).
  - "Method Foo() has no unit test", with no diff test to judge → DO NOT FILE (mere
    absence; the coverage gate owns it). Same for "branch X uncovered" and "no test
    drives feature Y end to end" — never file what you cannot cite to a diff test.

  Tests that cannot execute due to ENVIRONMENT limits (a missing external service, an
  unsupported platform) are out of scope for scoring. This does NOT exempt tests DISABLED IN
  SOURCE ([Skip]/[Ignore]/commented-out/removed) — those are graded per the disabled-test
  rule above.
  Tests which cannot be run in this environment are not part of the scoring or auditing criteria.
